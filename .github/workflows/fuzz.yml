# Fuzzing (spec 12.2 and 11.10): 60 s per target on each push and pull
# request, 10 minutes per target every night.
name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          [link_parse, envelope_decode, refname_check, message_decode, lan_packet]
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install --locked cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}
        run: scripts/fuzz.sh ${{ matrix.target }}
      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
