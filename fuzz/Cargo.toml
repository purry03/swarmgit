[package]
name = "swarm-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
swarm-core = { path = "../crates/swarm-core" }

[profile.release]
debug = true

[[bin]]
name = "link_parse"
path = "fuzz_targets/link_parse.rs"
test = false
doc = false

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false

[[bin]]
name = "refname_check"
path = "fuzz_targets/refname_check.rs"
test = false
doc = false

[workspace]
