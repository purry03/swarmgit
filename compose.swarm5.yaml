# Five-container acceptance topology: 2 relays, 3 peers.
#
#   peer-a ── neta ──┐
#   peer-b ── netb ──┼── relay1, relay2   (relay1 also serves static mirrors)
#   peer-c ── netc ──┘
#
# neta, netb and netc are internal networks with no route between them, so
# the peers can only reach each other through a relay (or a static mirror
# hosted on relay1). Run it with tests/e2e/swarm5.sh.

name: swarmgit-swarm5

x-image: &image
  build:
    context: .
    dockerfile: Dockerfile.relay
  image: swarmgit-relay-test
  init: true

x-peer: &peer
  <<: *image
  environment:
    SWARM_RELAYS: relay1:42425,relay2:42425
    SWARM_RELAY_DELAY_MS: "200"
    SWARM_FIND_TIMEOUT: "15"

services:
  relay1:
    <<: *image
    command: ["swarm-relay", "--listen", "0.0.0.0:42425", "--name", "relay1:42425"]
    networks:
      neta: {aliases: [relay1]}
      netb: {aliases: [relay1]}
      netc: {aliases: [relay1]}

  relay2:
    <<: *image
    command: ["swarm-relay", "--listen", "0.0.0.0:42425", "--name", "relay2:42425"]
    networks:
      neta: {aliases: [relay2]}
      netb: {aliases: [relay2]}
      netc: {aliases: [relay2]}

  peer-a:
    <<: *peer
    networks: [neta]

  peer-b:
    <<: *peer
    networks: [netb]

  peer-c:
    <<: *peer
    networks: [netc]

networks:
  neta: {internal: true}
  netb: {internal: true}
  netc: {internal: true}
