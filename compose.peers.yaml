# Two Swarmgit peers on one Docker network.
#
# Start:  docker compose -f compose.peers.yaml up -d --build
# Shell:  docker compose -f compose.peers.yaml exec peer-a bash
# Reset:  docker compose -f compose.peers.yaml down -v
#
# `peer-a` advertises itself as host `a` and `peer-b` as host `b`; those names
# resolve inside the network, so the link printed by `swarm link` works on the
# other container without any extra hints.

name: swarmgit-peers

services:
  peer-a:
    build:
      context: .
      dockerfile: Dockerfile.peers
    image: swarmgit-peer
    hostname: a
    init: true
    stdin_open: true
    tty: true
    environment:
      SWARM_HOME: /state/home
      SWARM_LISTEN: 0.0.0.0:42424
      SWARM_ADVERTISE: a
    volumes:
      - a-state:/state
    networks:
      peers:
        aliases:
          - a

  peer-b:
    build:
      context: .
      dockerfile: Dockerfile.peers
    image: swarmgit-peer
    hostname: b
    init: true
    stdin_open: true
    tty: true
    environment:
      SWARM_HOME: /state/home
      SWARM_LISTEN: 0.0.0.0:42424
      SWARM_ADVERTISE: b
    volumes:
      - b-state:/state
    networks:
      peers:
        aliases:
          - b

networks:
  peers:

volumes:
  a-state:
  b-state:
