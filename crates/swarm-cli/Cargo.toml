[package]
name = "swarm-cli"
description = "The swarm binary: CLI, git remote helper and daemon entry."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "swarm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
swarm-core = { path = "../swarm-core" }
swarm-daemon = { path = "../swarm-daemon" }
swarm-disc = { path = "../swarm-disc" }
swarm-relay = { path = "../swarm-relay" }
swarm-store = { path = "../swarm-store" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "forbid"
