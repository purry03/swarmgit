[package]
name = "swarm-daemon"
description = "Swarmgit daemon, IPC server and repo orchestration."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
fs2.workspace = true
hex.workspace = true
if-addrs = "0.15"
igd-next = { version = "0.18", features = ["aio_tokio"] }
serde.workspace = true
serde_json.workspace = true
swarm-core = { path = "../swarm-core" }
swarm-disc = { path = "../swarm-disc" }
swarm-net = { path = "../swarm-net" }
swarm-relay = { path = "../swarm-relay" }
swarm-store = { path = "../swarm-store" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
swarm-testpeer = { path = "../swarm-testpeer" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
