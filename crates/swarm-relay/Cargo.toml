[package]
name = "swarm-relay"
description = "Swarmgit relay: lets peers that cannot accept inbound connections reach each other."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "swarm-relay"
path = "src/main.rs"

[[bin]]
name = "swarm-relay-peer"
path = "src/bin/peer.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
snow.workspace = true
swarm-core = { path = "../swarm-core" }
swarm-disc = { path = "../swarm-disc" }
swarm-net = { path = "../swarm-net" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mainline = { version = "8", default-features = false, features = ["async"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
