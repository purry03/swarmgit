[package]
name = "swarm-disc"
description = "Swarmgit discovery routes. Link hints and LAN multicast."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures-lite = "2"
if-addrs = "0.15"
mainline = { version = "8", default-features = false, features = ["async"] }
socket2 = { version = "0.6", features = ["all"] }
swarm-core = { path = "../swarm-core" }
swarm-net = { path = "../swarm-net" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints.rust]
unsafe_code = "forbid"
