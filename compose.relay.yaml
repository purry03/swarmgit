# Relay acceptance topology (design spec R1 and R2).
#
#   peer-a ── neta ──┐
#                    relay
#   peer-b ── netb ──┘
#
# `neta` and `netb` are internal networks with no route between them, so
# peer-a and peer-b cannot reach each other. Only the relay is on both.
# Run it with tests/e2e/relay.sh.

name: swarmgit-relay

x-image: &image
  build:
    context: .
    dockerfile: Dockerfile.relay
  image: swarmgit-relay-test
  init: true

services:
  relay:
    <<: *image
    command: ["swarm-relay", "--listen", "0.0.0.0:42425", "--name", "relay:42425"]
    networks:
      neta:
        aliases: [relay]
      netb:
        aliases: [relay]

  peer-a:
    <<: *image
    networks: [neta]

  peer-b:
    <<: *image
    environment:
      SWARM_RELAYS: relay:42425
    networks: [netb]

networks:
  neta:
    internal: true
  netb:
    internal: true
