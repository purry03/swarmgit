[workspace]
members = [
    "crates/swarm-core",
    "crates/swarm-store",
    "crates/swarm-net",
    "crates/swarm-relay",
    "crates/swarm-disc",
    "crates/swarm-daemon",
    "crates/swarm-cli",
    "crates/swarm-testpeer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["std"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
data-encoding = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fs2 = "0.4"
getrandom = "0.4"
hex = "0.4"
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc", "getrandom"] }
ml-kem = { version = "0.3.4", default-features = false, features = ["alloc", "getrandom"] }
proptest = "1"
rand_core = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
snow = "0.10"
serde_json = "1"
serde_yaml = "0.9"
slh-dsa = { version = "0.2.0-rc.5", features = ["alloc"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "io-std", "time", "signal", "sync", "macros"] }
tracing = "0.1"
ureq = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo test` is the acceptance command, and SLH-DSA signing is far too slow
# at opt-level 0. Generic hash loops are monomorphized into the test binary, so
# optimizing only the dependency is not enough.
[profile.test]
opt-level = 3

# The post-quantum crates are extremely slow in an unoptimized build. Optimize
# dependencies too, so `cargo build` and `cargo run` stay usable.
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3
[profile.dev.package.slh-dsa]
opt-level = 3

# Generic hash and NTT loops are monomorphized into this crate, so optimizing
# only the dependencies is not enough.
[profile.dev]
opt-level = 2
